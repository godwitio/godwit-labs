services:

  # ── MinIO (source) ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: godwit-lab-iam-minio
    ports:
      - "8000:9000"   # S3 API      →  http://localhost:8000
      - "8001:8001"   # Web console →  http://localhost:8001
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":8001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:     5s
      timeout:      5s
      retries:      12
      start_period: 10s
    networks:
      - godwit-lab

  # ── RustFS (destination) ──────────────────────────────────────────────────────
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.6
    container_name: godwit-lab-iam-rustfs
    ports:
      - "6000:9000"   # S3 API      →  http://localhost:6000
      - "6001:9001"   # Web console →  http://localhost:6001
    environment:
      RUSTFS_ACCESS_KEY:       rustfsadmin
      RUSTFS_SECRET_KEY:       rustfsadmin
      RUSTFS_VOLUMES:          /data
      RUSTFS_ADDRESS:          0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE:   "true"
      RUSTFS_CONSOLE_ADDRESS:  0.0.0.0:9001
    volumes:
      - rustfs-data:/data
    networks:
      - godwit-lab

networks:
  godwit-lab:
    driver: bridge

volumes:
  minio-data:
  rustfs-data:
