name: Godwit Sync (OIDC)

# The official aws-actions/configure-aws-credentials action performs the
# OIDC → sts:AssumeRoleWithWebIdentity exchange and exports temporary
# AWS credentials into the job environment. Godwit then consumes them
# through --source-auth env / --destination-auth env via the standard
# AWS SDK credential chain. Godwit does not implement CI-platform-specific
# OIDC fetchers in the binary — that is the action's responsibility.
# See the article section "Why Godwit defers CI-platform OIDC to the
# platform action" for the rationale.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/godwit-sync.yml'

permissions:
  id-token: write    # required for the action to request the OIDC JWT
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: godwit-oidc-lab-${{ github.run_id }}

      - name: Verify the role is the one we expect
        run: aws sts get-caller-identity

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install Godwit Sync
        run: |
          brew tap godwitio/packages https://github.com/godwitio/packages
          brew install godwit-sync
          godwit version

      - name: Sync s3://…/source/ → s3://…/replica/
        run: |
          godwit sync \
            --source "s3://${{ vars.LAB_BUCKET }}/source" \
            --destination "s3://${{ vars.LAB_BUCKET }}/replica" \
            --source-endpoint s3.amazonaws.com \
            --source-region "${{ vars.AWS_REGION }}" \
            --source-auth env \
            --destination-endpoint s3.amazonaws.com \
            --destination-region "${{ vars.AWS_REGION }}" \
            --destination-auth env \
            --state-path ./godwit-oidc-lab.state.db \
            --run-id "oidc-${{ github.run_id }}"

      - name: List the replica prefix
        run: aws s3 ls "s3://${{ vars.LAB_BUCKET }}/replica/"
