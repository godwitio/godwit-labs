services:

  # -- MinIO ----------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: godwit-lab-minio
    ports:
      - "8000:9000"   # S3 API
      - "8001:8001"   # Web console  ->  http://localhost:8001
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":8001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:     5s
      timeout:      5s
      retries:      12
      start_period: 10s
    networks:
      - godwit-lab

  # -- MinIO 2 (destination for 12 500 migration) --------------------------
  minio2:
    image: minio/minio:latest
    container_name: godwit-lab-minio2
    ports:
      - "8002:9000"   # S3 API
      - "8003:8003"   # Web console  ->  http://localhost:8003
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":8003"
    volumes:
      - minio2-data:/data
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:     5s
      timeout:      5s
      retries:      12
      start_period: 10s
    networks:
      - godwit-lab

  # -- Prometheus -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: godwit-lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:         ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval:     10s
      timeout:      5s
      retries:      6
      start_period: 10s
    networks:
      - godwit-lab

  # -- Grafana --------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: godwit-lab-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/godwit-sync.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:         ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval:     10s
      timeout:      5s
      retries:      6
      start_period: 15s
    networks:
      - godwit-lab

networks:
  godwit-lab:
    driver: bridge

volumes:
  minio-data:
  minio2-data:
  prometheus-data:
  grafana-data:
