global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: godwit
    static_configs:
      - targets: ["host.docker.internal:9091"]
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: /metrics
