services:

  # ── Moto (source) ──────────────────────────────────────────────────────────
  # AWS S3 mock that preserves StorageClass in ListObjectVersions responses
  # and accepts GLACIER on PutObject — unlike MinIO which rejects GLACIER.
  moto-source:
    image: motoserver/moto:latest
    container_name: godwit-version-lab-moto
    ports:
      - "5555:5000"   # S3-compatible API
    environment:
      - MOTO_S3_CUSTOM_ENDPOINTS=http://localhost:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - godwit-version-lab

  # ── MinIO (destination) ────────────────────────────────────────────────────
  minio-dest:
    image: minio/minio:latest
    container_name: godwit-version-lab-minio
    ports:
      - "8000:9000"   # S3 API
      - "8001:8001"   # Web console  →  http://localhost:8001
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":8001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:     5s
      timeout:      5s
      retries:      12
      start_period: 10s
    networks:
      - godwit-version-lab

networks:
  godwit-version-lab:
    driver: bridge

volumes:
  minio-data:
