source:
  url: "s3://logs-archive"
  endpoint: "localhost:7000"
  access_key: "rustfsadmin"
  secret_key: "rustfsadmin"
  secure: false

destination:
  url: "s3://logs-archive"
  endpoint: "localhost:7001"
  access_key: "rustfsadmin"
  secret_key: "rustfsadmin"
  secure: false

options:
  parallel: 8
  plan_parallel: 40

rate_limit:
  read_bps: 1048576

run:
  run_id: "logs-archive"
  state_path: "./state/logs-archive.state.db"
  logs_dir: "./state/logs"

status:
  addr: ":7102"
  drain_timeout: 15

output:
  brief: true
