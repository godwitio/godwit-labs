global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: godwit
    static_configs:
      - targets: ["host.docker.internal:7100"]
        labels:
          pair: app-data
      - targets: ["host.docker.internal:7101"]
        labels:
          pair: ml-models
      - targets: ["host.docker.internal:7102"]
        labels:
          pair: logs-archive
      - targets: ["host.docker.internal:7103"]
        labels:
          pair: user-uploads
    scrape_interval: 2s
    scrape_timeout: 2s
    metrics_path: /metrics
