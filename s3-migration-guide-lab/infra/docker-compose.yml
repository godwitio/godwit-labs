services:

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: godwit-lab-minio
    ports:
      - "8000:9000"   # S3 API
      - "8001:8001"   # Web console  →  http://localhost:8001
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":8001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:     5s
      timeout:      5s
      retries:      12
      start_period: 10s
    networks:
      - godwit-lab

  # ── Garage ───────────────────────────────────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.0.0
    container_name: godwit-lab-garage
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # RPC
      - "3902:3902"   # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    healthcheck:
      test:         ["CMD", "/garage", "status"]
      interval:     10s
      timeout:      5s
      retries:      12
      start_period: 15s
    networks:
      - godwit-lab

  # ── Garage Web UI ────────────────────────────────────────────────────────────
  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: godwit-lab-garage-webui
    depends_on:
      garage:
        condition: service_healthy
    ports:
      - "3909:3909"   # Web UI  →  http://localhost:3909
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: http://garage:3902
      API_ADMIN_KEY: godwit-lab-admin-token
      S3_ENDPOINT_URL: http://garage:3900
    networks:
      - godwit-lab

networks:
  godwit-lab:
    driver: bridge

volumes:
  minio-data:
  garage-meta:
  garage-data:
